services:
  - type: web
    name: swgoh-tracker-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://jimmyhzz1.github.io
      - key: SWGOH_GG_BASE
        value: https://swgoh.gg
