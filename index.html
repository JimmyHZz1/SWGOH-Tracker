<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SWGOH Tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>SWGOH Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#0b1020;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 15px}h1{margin:0;font-size:28px}.sub{color:#b9c2d0;font-size:14px}main{padding:15px 14px 105px;max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:15px;margin-bottom:12px}.stat{font-size:25px;font-weight:750}.small{font-size:12px;color:#667085}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}h2{font-size:18px;margin:0}.btn{border:0;border-radius:11px;padding:9px 12px;background:#2563eb;color:white;font-weight:650}.secondary{background:#eaf0ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.item{padding:13px 0;border-bottom:1px solid #e4e7ec}.item:last-child{border-bottom:0}.name{font-weight:650}.pill{background:#eaf0ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:650}progress{width:100%;height:8px;margin-top:8px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ec;display:flex;padding:7px 7px calc(env(safe-area-inset-bottom) + 7px);z-index:5}nav button{flex:1;border:0;background:none;color:#667085;font-size:11px;padding:7px 2px}nav button.active{color:#2563eb;font-weight:700}nav span{display:block;font-size:19px}.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:10px;font-size:13px}.ok{background:#ecfdf3;color:#166534}.bad{background:#fef2f2;color:#991b1b}.empty{text-align:center;color:#667085;padding:25px}
</style></head><body><header><h1>SWGOH Tracker</h1><div class="sub">v0.4 · personal roster tracker</div></header><main id="app"></main><nav><button data-tab="dashboard"><span>▦</span>Dashboard</button><button data-tab="characters"><span>♟</span>Characters</button><button data-tab="resources"><span>◈</span>Resources</button><button data-tab="account"><span>◎</span>Account</button><button data-tab="settings"><span>⚙</span>Settings</button></nav><script>
(function(){'use strict';var KEY='swgoh-v04',tab='dashboard';var demo={allyCode:'',lastSync:'',profile:null,characters:[['Supreme Leader Kylo Ren',13,7,9],['Ahsoka Tano',13,5,7],['Echo',13,6,6],['Moff Tarkin',13,7,7],['Count Dooku',13,1,5]].map(function(x){return{name:x[0],gear:x[1],relic:x[2],target:x[3]}}),resources:[['Crystals',0,5000],['Credits',0,10000000],['Kyrotech',0,400],['Signal Data',0,300],['Carbonite Circuit Boards',0,100],['Bronzium Wiring',0,100]].map(function(x){return{name:x[0],amount:x[1],target:x[2]}})};var s=load();function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.characters&&x.resources)return x}catch(e){}return JSON.parse(JSON.stringify(demo))}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function esc(x){return String(x??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function cp(c){return Math.min(1,Math.max(0,(+c.relic||0)/(+c.target||1)))}function rp(r){return Math.min(1,Math.max(0,(+r.amount||0)/(+r.target||1)))}function render(){var a=document.getElementById('app');a.innerHTML=tab==='dashboard'?dash():tab==='characters'?chars():tab==='resources'?resources():tab==='account'?account():settings();document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);b.onclick=function(){tab=b.dataset.tab;render()}});bind()}function dash(){var avg=s.characters.reduce(function(a,c){return a+cp(c)},0)/(s.characters.length||1);return '<div class="grid"><div class="card"><div class="stat">'+Math.round(avg*100)+'%</div><div class="small">Average character progress</div></div><div class="card"><div class="stat">'+s.characters.length+'</div><div class="small">Characters tracked</div></div></div><div class="card"><div class="row"><div class="grow"><b>Account</b><div class="small">'+(s.allyCode||'No Ally Code linked')+'</div></div><span class="pill">'+(s.profile?'Linked':'Local')+'</span></div></div><div class="head"><h2>Priority Characters</h2><button class="btn secondary" data-go="characters">Manage</button></div><div class="card">'+s.characters.slice().sort(function(a,b){return cp(a)-cp(b)}).slice(0,5).map(line).join('')+'</div><div class="head"><h2>Resources</h2><button class="btn secondary" data-go="resources">Manage</button></div><div class="card">'+s.resources.slice(0,4).map(rline).join('')+'</div>'}function line(c){return '<div class="item"><div class="row"><div class="grow"><div class="name">'+esc(c.name)+'</div><div class="small">R'+c.relic+' → R'+c.target+'</div></div><span class="pill">'+Math.round(cp(c)*100)+'%</span></div><progress max="100" value="'+Math.round(cp(c)*100)+'"></progress></div>'}function rline(r){return '<div class="item"><div class="name">'+esc(r.name)+'</div><div class="small">'+(+r.amount).toLocaleString()+' / '+(+r.target).toLocaleString()+'</div><progress max="100" value="'+Math.round(rp(r)*100)+'"></progress></div>'}function chars(){return '<div class="head"><h2>Characters</h2><button class="btn" data-add="char">+ Add</button></div><div class="card">'+(s.characters.length?s.characters.map(function(c,i){return '<div class="item"><div class="name">'+esc(c.name)+'</div><div class="small">Gear '+c.gear+' · R'+c.relic+' → R'+c.target+'</div><progress max="100" value="'+Math.round(cp(c)*100)+'"></progress><div class="actions"><button class="btn secondary" data-edit="c" data-i="'+i+'">Edit</button><button class="btn danger" data-del="c" data-i="'+i+'">Delete</button></div></div>'}).join(''):'<div class="empty">No characters.</div>')+'</div>'}function resources(){return '<div class="head"><h2>Resources</h2><button class="btn" data-add="res">+ Add</button></div><div class="card">'+s.resources.map(function(r,i){return '<div class="item"><div class="name">'+esc(r.name)+'</div><div class="small">'+(+r.amount).toLocaleString()+' / '+(+r.target).toLocaleString()+'</div><progress max="100" value="'+Math.round(rp(r)*100)+'"></progress><div class="actions"><button class="btn secondary" data-edit="r" data-i="'+i+'">Edit</button><button class="btn danger" data-del="r" data-i="'+i+'">Delete</button></div></div>'}).join('')+'</div>'}function account(){return '<div class="card"><h2>SWGOH Account</h2><p class="small">Enter your 9-digit Ally Code.</p><input id="ally" inputmode="numeric" value="'+esc(s.allyCode)+'" placeholder="337627356"><div class="actions"><button class="btn" data-link="1">Save Ally Code</button><button class="btn secondary" data-sync="1">Sync Now</button></div><div id="status" class="status '+(s.profile?'ok':'')+'">'+(s.profile?'Last sync: '+esc(s.lastSync):'Not synced yet.')+'</div></div>'+(s.profile?'<div class="card"><h2>'+esc(s.profile.name||'Player')+'</h2><p class="small">Galactic Power: '+(+s.profile.gp||+s.profile.galacticPower||0).toLocaleString()+'</p><p class="small">Roster received: '+(s.profile.roster||[]).length+'</p></div>':'')+'<div class="card"><b>Live API</b><p class="small">v0.4 tries public SWGOH data endpoints. If Safari blocks the request because of CORS or the endpoint requires credentials, the app will tell you instead of appearing broken.</p></div>'}function settings(){return '<div class="card"><h2>Backup</h2><p class="small">Your data is stored locally.</p><div class="actions"><button class="btn secondary" data-export="1">Export</button><button class="btn danger" data-reset="1">Reset</button></div></div><div class="card"><h2>SWGOH Tracker v0.4</h2><p class="small">PWA designed for iPhone and GitHub Pages.</p></div>'}function bind(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){tab=b.dataset.go;render()}});document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){if(b.dataset.add==='char')s.characters.push({name:'New Character',gear:1,relic:0,target:5});else s.resources.push({name:'New Resource',amount:0,target:100});save();render();edit(b.dataset.add,s[b.dataset.add==='char'?'characters':'resources'].length-1)}});document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){edit(b.dataset.edit,+b.dataset.i)}});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var k=b.dataset.del==='c'?'characters':'resources',i=+b.dataset.i;if(confirm('Delete this item?')){s[k].splice(i,1);save();render()}}});var link=document.querySelector('[data-link]');if(link)link.onclick=function(){var v=document.getElementById('ally').value.replace(/\D/g,'');if(v.length!==9){alert('Ally Code must be 9 digits.');return}s.allyCode=v;save();render()};var sync=document.querySelector('[data-sync]');if(sync)sync.onclick=syncApi;var ex=document.querySelector('[data-export]');if(ex)ex.onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='swgoh-tracker-backup.json';a.click()};var reset=document.querySelector('[data-reset]');if(reset)reset.onclick=function(){if(confirm('Reset all data?')){s=JSON.parse(JSON.stringify(demo));save();render()}}}function edit(k,i){if(k==='char'){var c=s.characters[i];var n=prompt('Character name',c.name);if(n===null)return;c.name=n;c.gear=+(prompt('Gear level',c.gear)||c.gear);c.relic=+(prompt('Current relic',c.relic)||c.relic);c.target=+(prompt('Target relic',c.target)||c.target)}else{var r=s.resources[i];var n=prompt('Resource name',r.name);if(n===null)return;r.name=n;r.amount=+(prompt('Current amount',r.amount)||r.amount);r.target=+(prompt('Target amount',r.target)||r.target)}save();render()}async function syncApi(){var code=(s.allyCode||'').replace(/\D/g,'');if(code.length!==9){alert('Save a 9-digit Ally Code first.');return}var st=document.getElementById('status');st.className='status';st.textContent='Trying live SWGOH data source…';var got=null;try{var r=await fetch('https://swgoh.gg/api/player/'+code,{headers:{Accept:'application/json'}});if(r.ok)got=await r.json()}catch(e){}if(!got){try{var r2=await fetch('https://api.swgoh.help/swgoh/player',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({allycodes:[Number(code)],language:'ENG_US',project:{allyCode:1,name:1,gp:1,galacticPower:1,roster:1}})});if(r2.ok)got=await r2.json()}catch(e){}}if(!got){st.className='status bad';st.textContent='Live sync could not be reached from Safari. This is normally a CORS/API-access restriction.';return}var p=got.result?got.result[0]:Array.isArray(got)?got[0]:got;s.profile=p;s.lastSync=new Date().toLocaleString();save();render()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});save();render()})();</script></body></html>
