<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SWGOH Tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>SWGOH Tracker v0.5</title><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--nav:#0b1020;--accent:#2563eb;--good:#15803d;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 13px;position:sticky;top:0;z-index:8;box-shadow:0 2px 12px #0002}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{margin:0;font-size:25px;line-height:1.05}.version{color:#aeb8ca;font-size:12px;margin-top:4px}.accountStats{text-align:right;font-size:12px;color:#d5dbea}.accountStats b{font-size:15px;color:#fff}.news{margin-top:12px;background:#18233d;border:1px solid #2b3b60;border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.news b{color:#8fb5ff}.main{padding:14px 14px 100px;max-width:820px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}.hero{padding:16px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.sectionHead h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:104px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:750;font-size:15px;box-shadow:0 1px 2px #00000008;cursor:pointer}.tile:active{transform:scale(.98)}.stat{font-size:27px;font-weight:800}.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.pill{background:#eaf0ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.bar{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700}.secondary{background:#eaf0ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.mutedBtn{background:#f2f4f7;color:#344054}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.name{font-weight:700}.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:10px;font-size:13px}.ok{background:#ecfdf3;color:#166534}.bad{background:#fef2f2;color:#991b1b}.warn{background:#fffbeb;color:#92400e}.empty{text-align:center;color:var(--muted);padding:25px}.countdown{font-size:25px;font-weight:800;letter-spacing:.5px}.chip{display:inline-block;padding:4px 7px;border-radius:7px;background:#f2f4f7;color:#344054;font-size:11px;margin:3px 3px 0 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 7px calc(env(safe-area-inset-bottom) + 7px);z-index:10}.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:10px;padding:5px 2px}.nav button.active{color:var(--accent);font-weight:800}.nav span{display:block;font-size:18px;margin-bottom:2px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.listBtn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.right{text-align:right}.subtle{background:#f8fafc}.hidden{display:none}@media(min-width:700px){.main{padding-left:20px;padding-right:20px}.grid{gap:14px}.tile{min-height:115px}}
</style></head><body><header><div class="top"><div class="brand"><h1>SWGOH Tracker</h1><div class="version">v0.5</div></div><div class="accountStats"><div>GP <b id="gp">—</b></div><div>💎 <b id="crystals">—</b></div></div></div><div class="news" id="news">🆕 <b>What's New:</b> v0.5 feature-complete foundation</div></header><main class="main" id="app"></main><div class="nav" id="nav"></div><script>
(()=>{'use strict';const KEY='swgoh-v05';const defaultState={allyCode:'',profile:null,roster:[],lastSync:'',crystals:null,conquest:{active:true,progress:0,tickets:0,nextTickets:2000,sector:'—',feats:'—'},priorities:[],pins:[],upcoming:[],versionHistory:[],resource:{}};let state=load(),tab='dashboard',newsIndex=0;const nav=[['dashboard','▦','Dashboard'],['gl','★','GL'],['conquest','🎯','Conquest'],['gac','⚔','GAC'],['settings','⚙','Settings']];
function load(){try{return Object.assign({},defaultState,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...defaultState}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(n){return Math.max(0,Math.min(100,Math.round(+n||0)))}function fmt(n){return n==null||n===''?'—':Number(n).toLocaleString()}function rosterChars(){return state.roster.filter(x=>!x.ship)}function progressFor(r){return pct(((+r.currentTier||0)/13)*70+((+r.relicTier||0)/9)*30)}
function render(){document.getElementById('app').innerHTML=pages[tab]();document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind();document.getElementById('gp').textContent=fmt(state.profile?.gp??state.profile?.galacticPower);document.getElementById('crystals').textContent=fmt(state.crystals)}
const pages={dashboard(){let gls=state.roster.filter(x=>['SUPREMELEADERKYLOREN','JEDIMASTERLUKE','LORDVADER','REY','JEDIMASTERKENOBI','JABBA','LEVIATHAN','SLKR'].includes(String(x.id||'').replace(/:.*$/,'').toUpperCase()));let avg=gls.length?gls.reduce((a,x)=>a+progressFor(x),0)/gls.length:0;let c=state.conquest;return `<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>📌 Journey Progress</h2><span class="pill">${pct(avg)}%</span></div><div class="small">Highest-priority Galactic Legend journey</div><div class="bar"><i style="width:${pct(avg)}%"></i></div><div class="actions"><button class="btn secondary" data-page="gl">View detailed needs</button></div></div><div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>🎯 Conquest</h2><span class="pill">${c.active?pct(c.progress)+'%':'Next'}</span></div>${c.active?`<div class="row"><div class="grow"><div class="small">${esc(c.sector)} · Feats ${esc(c.feats)}</div><div class="bar"><i style="width:${pct(c.progress)}%"></i></div></div><div class="right"><b>🎟 ${fmt(c.tickets)}</b><div class="small">/ ${fmt(c.nextTickets)}</div></div></div>`:`<div class="countdown" id="countdown">${nextConquest()}</div><div class="small">until the next Conquest</div>`}<div class="actions"><button class="btn secondary" data-page="conquest">Open Conquest Planner</button></div></div><div class="sectionHead"><h2>Tracker</h2></div><div class="grid">${[['gl','GALACTIC LEGENDS'],['events','EVENTS'],['resources','RESOURCES'],['conquest','CONQUEST PLANNER'],['solo','SOLO JOURNEYS'],['gac','GAC COUNTERS'],['characters','CHARACTERS'],['teams','TEAMS']].map(x=>`<div class="tile" data-page="${x[0]}">${x[1]}</div>`).join('')}</div>`},
gl(){return trackerPage('Galactic Legends','GL and journey progress, sorted with completed journeys at the bottom.','gl')},solo(){return trackerPage('Solo Journeys','Individual character and ship journeys with pinning and priorities.','solo')},characters(){let chars=rosterChars();return `<div class="sectionHead"><h2>Characters</h2><button class="btn secondary" data-page="gl">Journey tracker</button></div><div class="card">${chars.length?chars.map(x=>`<div class="item"><div class="row"><div class="grow"><div class="name">${esc(x.name||x.id||'Character')}</div><div class="small">Gear ${esc(x.currentTier??x.gear??'—')} · Relic ${esc(x.relicTier??x.relic??0)}</div></div><span class="pill">${progressFor(x)}%</span></div><div class="bar"><i style="width:${progressFor(x)}%"></i></div></div>`).join(''):'<div class="empty">Sync your Ally Code to populate your roster.</div>'}</div>`},
resources(){return `<div class="sectionHead"><h2>Resources</h2></div><div class="card"><div class="small">v0.5 uses synced roster requirements. Private inventory is intentionally reserved for v0.6, so this page does not pretend to know unequipped materials.</div><div class="item"><div class="name">Required upgrade planning</div><div class="small">Select a journey to calculate roster-side requirements.</div></div><div class="actions"><button class="btn" data-page="gl">Open GL planner</button></div></div>`},
conquest(){let c=state.conquest;return `<div class="sectionHead"><h2>Conquest Planner</h2><button class="btn secondary" data-toggle-conquest>Toggle active</button></div><div class="card"><div class="two"><div><div class="small">Progress</div><div class="stat">${c.active?pct(c.progress)+'%':'Inactive'}</div></div><div><div class="small">Reward tickets</div><div class="stat">${fmt(c.tickets)}</div></div></div><label>Sector</label><input id="cSector" value="${esc(c.sector)}"><label>Feats completed</label><input id="cFeats" value="${esc(c.feats)}"><label>Progress %</label><input id="cProgress" type="number" min="0" max="100" value="${pct(c.progress)}"><label>Tickets earned</label><input id="cTickets" type="number" min="0" value="${fmt(c.tickets).replace(/,/g,'')}"><label>Next reward tickets</label><input id="cNext" type="number" min="1" value="${fmt(c.nextTickets).replace(/,/g,'')}"><div class="actions"><button class="btn" data-save-conquest>Save Conquest</button></div><div class="status warn">If the API does not expose ticket progress, these fields provide the agreed manual fallback. Reward thresholds can be updated in <b>data/conquest.json</b>.</div></div><div class="card"><b>Feat Assistant</b><p class="small">v0.5 foundation: use your synced roster to build future feat/team recommendations.</p></div>`},
gac(){return `<div class="sectionHead"><h2>GAC Counters</h2></div><div class="card"><div class="small">Roster-aware counter architecture is included. The counter catalogue is intentionally data-driven so it can be expanded without changing the UI.</div>${['5v5','3v3','Fleets'].map(x=>`<button class="listBtn"><b>${x}</b><div class="small">Open roster-aware counter list</div></button>`).join('')}</div><div class="card"><b>Battle Planner</b><p class="small">Personal battle notes and statistics foundation.</p></div>`},
events(){return `<div class="sectionHead"><h2>Events</h2></div><div class="card"><div class="item"><div class="name">Event watchlist</div><div class="small">Highlight events you want to complete when they return.</div></div><div class="item"><div class="name">Event history</div><div class="small">Historical completion tracking foundation.</div></div></div>`},
teams(){return `<div class="sectionHead"><h2>Team Builder</h2></div><div class="card"><div class="small">Build and save teams from your synced roster. GAC and Conquest recommendations plug into this layer.</div><div class="actions"><button class="btn" data-page="characters">Use roster</button></div></div>`},
settings(){return `<div class="card"><h2>Account & Sync</h2><label>Ally Code</label><input id="ally" inputmode="numeric" placeholder="337627356" value="${esc(state.allyCode)}"><div class="actions"><button class="btn" data-save-ally>Save Ally Code</button><button class="btn secondary" data-sync>Sync Now</button></div><div id="syncStatus" class="status">${state.lastSync?'Last successful sync: '+esc(state.lastSync):'Not synced yet.'}</div></div><div class="card"><h2>Version History</h2>${versionHistory().map(v=>`<button class="listBtn" data-version="${v.v}"><b>${v.v}${v.v==='v0.5'?' — Current':''}</b><div class="small">${v.summary}</div></button>`).join('')}</div><div class="card"><h2>🚀 Upcoming Features</h2><div class="small">Edit <b>data/upcoming-features.json</b> in the repository. No new app compile is required for roadmap text changes.</div><div id="upcoming">Loading…</div></div><div class="card"><h2>Backup</h2><div class="actions"><button class="btn secondary" data-export>Export local data</button><button class="btn danger" data-reset>Reset local data</button></div></div>`}}
function trackerPage(title,desc,type){let items=state.roster.filter(x=>x[type==='gl'?'isGL':'isJourney']);items.sort((a,b)=>{let pa=progressFor(a),pb=progressFor(b);return (pa===100)-(pb===100)||pb-pa});return `<div class="sectionHead"><h2>${title}</h2></div><div class="card"><div class="small">${desc}</div></div><div class="card">${items.length?items.map(x=>`<div class="item"><div class="row"><div class="grow"><div class="name">${esc(x.name||x.id)}</div><div class="small">Gear ${esc(x.currentTier??'—')} · Relic ${esc(x.relicTier??0)}</div></div><span class="pill">${progressFor(x)}%</span></div><div class="bar"><i style="width:${progressFor(x)}%"></i></div></div>`).join(''):'<div class="empty">No journey data is available yet. Sync your Ally Code, then add journey requirements to the versioned game data.</div>'}</div>`}
function versionHistory(){return[{v:'v0.5',summary:'Feature-complete foundation: sync architecture, dashboard, GL/Journeys, Conquest, GAC, Events, Resources, Teams, priorities and settings.'},{v:'v0.4',summary:'Existing PWA dashboard/account/characters/resources foundation.'},{v:'v0.2',summary:'Original PWA prototype and local tracking foundation.'}]}
function nextConquest(){return 'Countdown configured by game-data release'}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{tab=b.dataset.page;render()});let saveAlly=document.querySelector('[data-save-ally]');if(saveAlly)saveAlly.onclick=()=>{let v=document.getElementById('ally').value.replace(/\D/g,'');if(v.length!==9){alert('Ally Code must be exactly 9 digits.');return}state.allyCode=v;save();render()};let sync=document.querySelector('[data-sync]');if(sync)sync.onclick=syncNow;let sc=document.querySelector('[data-save-conquest]');if(sc)sc.onclick=()=>{state.conquest.sector=document.getElementById('cSector').value;state.conquest.feats=document.getElementById('cFeats').value;state.conquest.progress=pct(document.getElementById('cProgress').value);state.conquest.tickets=Number(document.getElementById('cTickets').value)||0;state.conquest.nextTickets=Number(document.getElementById('cNext').value)||2000;save();render()};let tc=document.querySelector('[data-toggle-conquest]');if(tc)tc.onclick=()=>{state.conquest.active=!state.conquest.active;save();render()};let ex=document.querySelector('[data-export]');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='swgoh-tracker-v0.5-backup.json';a.click()};let re=document.querySelector('[data-reset]');if(re)re.onclick=()=>{if(confirm('Reset local v0.5 data?')){state=JSON.parse(JSON.stringify(defaultState));save();render()}}}
async function syncNow(){let code=(state.allyCode||'').replace(/\D/g,'');if(code.length!==9){alert('Save a 9-digit Ally Code first.');return}let box=document.getElementById('syncStatus');box.className='status';box.textContent='Syncing Ally Code through the configured backend…';try{let r=await fetch((window.SWGOH_CONFIG?.API_BASE||'/api')+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allyCode:code})});if(!r.ok)throw new Error(await r.text());let d=await r.json();if(!d.allyCode||String(d.allyCode).replace(/\D/g,'')!==code)throw new Error('Backend returned a different Ally Code.');state.profile=d.profile||null;state.roster=(d.roster||[]).map(normalizeUnit);state.lastSync=new Date().toLocaleString();save();render();}catch(e){box.className='status bad';box.textContent='Sync failed: '+e.message+'. Check the backend URL/configuration and Comlink service.'}}
function normalizeUnit(u){let id=String(u.definitionId||u.defId||u.id||'').replace(/:.*$/,'');let name=u.name||id;let relic=u.relic?.currentTier??u.relic?.tier??u.relicTier??0;let tier=u.currentTier??u.gear??u.gearTier??0;return{id,name,currentTier:tier,relicTier:relic,ship:!!u.ship,isGL:!!u.isGL,isJourney:!!u.isJourney}}
setInterval(()=>{let n=['🆕 <b>New:</b> v0.5 feature-complete foundation','🔄 <b>Sync:</b> Ally Code now routes through a backend layer','🎯 <b>Conquest:</b> tickets + manual fallback supported','📌 <b>Dashboard:</b> journey progress stays at the top'];newsIndex=(newsIndex+1)%n.length;document.getElementById('news').innerHTML=n[newsIndex]},6000);fetch('./data/upcoming-features.json').then(r=>r.json()).then(items=>{let el=document.getElementById('upcoming');if(el)el.innerHTML=items.map(x=>`<div class="item"><b>${esc(x.title)}</b><div><span class="chip">${esc(x.status)}</span></div><div class="small">${esc(x.description)}</div></div>`).join('')}).catch(()=>{});save();render()})();
</script><script src="./config.js"></script></body></html>
