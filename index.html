<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SWGOH Tracker">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>SWGOH Tracker v0.5</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--nav:#0b1020;--accent:#2563eb;--good:#15803d;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{margin:0;font-size:25px;line-height:1.05}.version{color:#aeb8ca;font-size:12px;margin-top:4px}.accountStats{text-align:right;font-size:12px;color:#d5dbea}.accountStats b{font-size:15px;color:#fff}
.news{margin-top:11px;background:#18233d;border:1px solid #2b3b60;border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.main{padding:14px 14px 96px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}
.hero{padding:16px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.sectionHead h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:104px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:750;font-size:15px;box-shadow:0 1px 2px #00000008;cursor:pointer}.tile:active{transform:scale(.98)}
.stat{font-size:27px;font-weight:800}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.pill,.chip{display:inline-block;background:#eaf0ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.chip{margin-top:4px}
.bar{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eaf0ff;color:#1d4ed8}.danger{background:#fee2e2;color:var(--danger)}.mutedBtn{background:#f2f4f7;color:#344054}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.name{font-weight:750}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:10px;font-size:12px}.status.good{background:#ecfdf3;color:#166534}.status.warn{background:#fffbeb;color:#92400e}.status.bad{background:#fef2f2;color:#991b1b}
.listBtn{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;cursor:pointer}.listBtn:last-child{border-bottom:0}.empty{text-align:center;padding:24px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;padding:9px 3px;color:#667085;font-size:10px;cursor:pointer}.nav button span{display:block;font-size:18px;margin-bottom:2px}.nav button.active{color:#1d4ed8;font-weight:800}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.check input{width:auto}.inline{display:flex;gap:8px;align-items:center}.right{text-align:right}
details summary{cursor:pointer;font-weight:750}.notice{border-left:4px solid var(--accent);padding-left:10px}.rank{font-size:11px;color:var(--muted);font-weight:700}
@media(max-width:520px){.grid{gap:9px}.tile{min-height:92px;font-size:13px}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><h1>SWGOH Tracker</h1><div class="version">v0.5</div></div>
    <div class="accountStats"><div>GP <b id="gp">—</b></div><div>💎 <b id="crystals">—</b></div></div>
  </div>
  <div class="news" id="news" title="Open Version History"></div>
</header>
<main class="main" id="app"></main>
<div class="nav" id="nav"></div>

<script src="./config.js"></script>
<script>
(()=>{'use strict';
const APP_VERSION='0.5';
const KEY='swgoh-tracker-v05';
const defaults={
 allyCode:'', profile:null, roster:[], lastSync:'', syncHistory:[],
 crystals:null, tab:'dashboard',
 pins:[], priorityOverrides:{}, priorities:[],
 conquest:{active:false,progress:0,tickets:0,nextTickets:2000,sector:'—',featsDone:0,featsTotal:0,nextStart:''},
 events:[], resources:{}, savedTeams:[], progressHistory:[], newsIndex:0
};
let state=load(), tab=state.tab||'dashboard', newsTimer;
const nav=[['dashboard','▦','Dashboard'],['gl','★','GL'],['conquest','🎯','Conquest'],['gac','⚔','GAC'],['settings','⚙','Settings']];
const journeys=[
 {id:'slkr',name:'Supreme Leader Kylo Ren',type:'GL',base:0},
 {id:'rey',name:'Rey',type:'GL',base:0},
 {id:'jml',name:'Jedi Master Luke Skywalker',type:'GL',base:0},
 {id:'jmk',name:'Jedi Master Kenobi',type:'GL',base:0},
 {id:'lv',name:'Lord Vader',type:'GL',base:0},
 {id:'jabba',name:'Jabba the Hutt',type:'GL',base:0},
 {id:'leia',name:'Leia Organa',type:'GL',base:0},
 {id:'aphra',name:'Doctor Aphra',type:'Solo',base:0},
 {id:'executor',name:'Executor',type:'Solo',base:0},
 {id:'profundity',name:'Profundity',type:'Solo',base:0},
 {id:'raddus',name:'Raddus',type:'Solo',base:0}
];
const gacCounters=[
 ['Jabba the Hutt','Leia Organa','Strong matchup; verify omicron/Datacron conditions.'],
 ['Lord Vader','Jedi Master Kenobi','Roster-aware counter candidate.'],
 ['Supreme Leader Kylo Ren','Jabba the Hutt','Common counter pairing to evaluate.'],
 ['Rey','Supreme Leader Kylo Ren','Common counter pairing to evaluate.'],
 ['General Skywalker','Darth Revan','Popular matchup.'],
 ['Reva Inquisitors','Jedi Knight Luke Skywalker','Popular defensive matchup.'],
 ['Executor','Profundity','Fleet counter pairing.'],
 ['Profundity','Executor','Fleet counter pairing.']
];
const newsItems=[
 '🆕 <b>New:</b> v0.5 feature-complete tracker architecture',
 '🎯 <b>New:</b> Conquest Planner with ticket tracking and fallback requirements',
 '⚔️ <b>New:</b> GAC counter catalogue and battle-planner foundation',
 '📌 <b>New:</b> pinned Journey Progress and manual priority overrides',
 '🔄 <b>Improved:</b> Ally Code sync now uses a backend layer'
];

function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){state.tab=tab;localStorage.setItem(KEY,JSON.stringify(state))}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return n==null||n===''?'—':Number(n).toLocaleString()}
function pct(n){return Math.max(0,Math.min(100,Math.round(Number(n)||0)))}
function rosterChars(){return state.roster.filter(x=>!x.ship)}
function progressFor(x){if(x.progress!=null)return pct(x.progress);const gear=Number(x.currentTier||x.gearTier||0), relic=Number(x.relicTier||0);return pct((gear/13)*70+(relic/9)*30)}
function journeyItems(type){return journeys.filter(j=>type==='all'||j.type===type).map(j=>{const r=state.roster.find(x=>String(x.id||'').toLowerCase().includes(j.id)||String(x.name||'').toLowerCase()===j.name.toLowerCase());const progress=r?progressFor(r):j.base;return {...j,progress,pinned:state.pins.includes(j.id),override:state.priorityOverrides[j.id]??null,roster:r}})}
function sortedJourneys(type){return journeyItems(type).sort((a,b)=>{const ap=a.override==null?0:a.override,bp=b.override==null?0:b.override;if(ap!==bp)return bp-ap;if(a.pinned!==b.pinned)return Number(b.pinned)-Number(a.pinned);if((a.progress===100)!=(b.progress===100))return Number(a.progress===100)-Number(b.progress===100);return b.progress-a.progress})}
function highestJourney(){const all=sortedJourneys('GL').filter(x=>x.progress<100);return all[0]||sortedJourneys('GL')[0]}
function nextConquest(){if(state.conquest.nextStart){const d=new Date(state.conquest.nextStart).getTime()-Date.now();if(d>0){let s=Math.floor(d/1000),days=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return `${days}d ${h}h ${m}m`}}return 'Next event date not configured'}
function render(){
 document.getElementById('app').innerHTML=pages[tab]();
 document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;save();render()});
 bind();
 document.getElementById('gp').textContent=fmt(state.profile?.gp??state.profile?.galacticPower);
 document.getElementById('crystals').textContent=fmt(state.crystals);
}
function progressCard(){
 const j=highestJourney(), pins=sortedJourneys('GL').filter(x=>x.pinned);
 return `<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>📌 Journey Progress</h2><span class="pill">${j?pct(j.progress):0}%</span></div>
 <div class="name">${esc(j?.name||'No journey selected')}</div><div class="small">${pins.length?`Pinned: ${pins.map(x=>esc(x.name)).join(', ')}`:'Automatically showing your highest-priority GL. You can pin multiple journeys.'}</div>
 <div class="bar"><i style="width:${pct(j?.progress)}%"></i></div>
 <div class="actions"><button class="btn secondary" data-page="gl">View detailed needs</button><button class="btn secondary" data-page="priorities">My Priorities</button></div></div>`;
}
function conquestCard(){
 const c=state.conquest;
 if(!c.active)return `<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>🎯 Next Conquest</h2><span class="pill">Countdown</span></div><div class="stat" id="dashCountdown">${nextConquest()}</div><div class="small">until the next Conquest</div><div class="actions"><button class="btn secondary" data-page="conquest">Open Conquest Planner</button></div></div>`;
 const f=c.featsTotal?`${c.featsDone}/${c.featsTotal}`:'—';
 return `<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>🎯 Conquest</h2><span class="pill">${pct(c.progress)}%</span></div>
 <div class="two"><div><div class="small">Sector</div><div class="name">${esc(c.sector)}</div><div class="small">Feats ${f}</div></div><div class="right"><div class="small">Reward Tickets</div><div class="name">🎟 ${fmt(c.tickets)}</div><div class="small">Next: ${fmt(c.nextTickets)}</div></div></div>
 <div class="bar"><i style="width:${pct(c.progress)}%"></i></div><div class="actions"><button class="btn secondary" data-page="conquest">Open Conquest Planner</button></div></div>`;
}
const pages={
 dashboard(){return `${progressCard()}${conquestCard()}<div class="sectionHead"><h2>Tracker</h2></div><div class="grid">
 ${[['gl','GALACTIC LEGENDS'],['events','EVENTS'],['resources','RESOURCES'],['conquest','CONQUEST PLANNER'],['solo','SOLO JOURNEYS'],['gac','GAC COUNTERS'],['characters','CHARACTERS'],['teams','TEAMS']].map(x=>`<div class="tile" data-page="${x[0]}">${x[1]}</div>`).join('')}</div>`},
 gl(){return journeyPage('Galactic Legends','GL requirements, percentages, pins, priorities and detailed needs.','GL')},
 solo(){return journeyPage('Solo Journeys','Solo character and ship journeys, independently tracked from GLs.','Solo')},
 priorities(){const list=sortedJourneys('all');return `<div class="sectionHead"><h2>My Priorities</h2></div><div class="card"><div class="small">Automatic ranking uses progress, pins and completion state. Use the controls to override it manually.</div></div><div class="card">${list.map((j,i)=>`<div class="item"><div class="row"><div class="grow"><span class="rank">#${i+1}</span> <span class="name">${esc(j.name)}</span><div class="small">${j.type} · ${j.progress}%</div></div><select data-priority="${j.id}"><option value="">Automatic</option><option value="100" ${j.override===100?'selected':''}>Highest</option><option value="80" ${j.override===80?'selected':''}>High</option><option value="50" ${j.override===50?'selected':''}>Medium</option><option value="20" ${j.override===20?'selected':''}>Low</option></select></div></div>`).join('')}</div>`},
 journeyPage(title,desc,type){const list=sortedJourneys(type), pinned=list.filter(x=>x.pinned);return `<div class="sectionHead"><h2>${title}</h2><button class="btn secondary" data-page="priorities">Priorities</button></div><div class="card"><div class="small">${desc} Completed journeys are automatically sent to the bottom; highest percentage is first within the remaining list.</div><div class="filters"><select id="journeyFilter"><option value="all">All</option><option value="active">In progress</option><option value="complete">Completed</option><option value="pinned">Pinned</option></select><select id="journeySort"><option value="progress">Highest progress</option><option value="priority">Priority</option><option value="name">Name</option></select></div></div><div class="card">${list.map(j=>`<details class="item" ${j===list[0]?'open':''}><summary><span class="row"><span class="grow">${j.pinned?'📌 ':''}<span class="name">${esc(j.name)}</span><span class="pill">${j.progress}%</span></span></summary><div class="small">${j.type} journey</div><div class="bar"><i style="width:${j.progress}%"></i></div><div class="actions"><button class="btn secondary" data-pin="${j.id}">${j.pinned?'Unpin':'Pin'}</button><button class="btn secondary" data-page="resources">View resource needs</button></div><div class="status">${j.roster?`Synced roster: Gear ${esc(j.roster.currentTier??'—')} · Relic ${esc(j.roster.relicTier??0)}`:'Roster data not yet linked. Requirements remain available from versioned game data.'}</div></details>`).join('')}</div><div class="card"><b>Pinned journeys</b><div class="small">${pinned.length?pinned.map(x=>esc(x.name)).join(' · '):'None — pin as many as you want.'}</div></div>`},
 characters(){const chars=rosterChars();return `<div class="sectionHead"><h2>Characters</h2><input id="charSearch" placeholder="Search characters…"></div><div class="card">${chars.length?chars.map(x=>`<div class="item charItem" data-name="${esc((x.name||x.id||'').toLowerCase())}"><div class="row"><div class="grow"><div class="name">${esc(x.name||x.id||'Character')}</div><div class="small">Gear ${esc(x.currentTier??x.gearTier??'—')} · Relic ${esc(x.relicTier??0)}</div></div><span class="pill">${progressFor(x)}%</span></div><div class="bar"><i style="width:${progressFor(x)}%"></i></div></div>`).join(''):'<div class="empty">Sync your Ally Code to populate your roster.</div>'}</div>`},
 resources(){return `<div class="sectionHead"><h2>Resources</h2></div><div class="card"><div class="notice"><b>v0.5 resource architecture</b><div class="small">Roster requirements are automatic. Private inventory is deliberately reserved for v0.6 until we have an authorised inventory provider.</div></div><label>Manual tracked resource</label><input id="resourceName" placeholder="e.g. Kyrotech Shock Prod"><label>Quantity</label><input id="resourceQty" type="number" min="0" placeholder="0"><div class="actions"><button class="btn" data-add-resource>Add Resource</button></div></div><div class="card">${Object.entries(state.resources).map(([k,v])=>`<div class="item"><div class="row"><span class="grow"><b>${esc(k)}</b></span><span class="pill">${fmt(v)}</span></div></div>`).join('')||'<div class="empty">No manually tracked resources yet.</div>'}</div><div class="card"><b>Upgrade Simulator</b><div class="small">Select a journey from the GL/Solo pages to view roster-side needs; inventory automation is planned for v0.6.</div></div>`},
 conquest(){const c=state.conquest;return `<div class="sectionHead"><h2>Conquest Planner</h2><button class="btn secondary" data-toggle-conquest>${c.active?'Set inactive':'Set active'}</button></div>
 <div class="card"><div class="three"><div><div class="small">Progress</div><div class="stat">${c.active?pct(c.progress)+'%':'—'}</div></div><div><div class="small">Tickets</div><div class="stat">${fmt(c.tickets)}</div></div><div><div class="small">Next reward</div><div class="stat">${fmt(c.nextTickets)}</div></div></div>
 <label>Sector</label><input id="cSector" value="${esc(c.sector)}"><label>Progress %</label><input id="cProgress" type="number" min="0" max="100" value="${pct(c.progress)}"><div class="two"><div><label>Feats completed</label><input id="cFeatsDone" type="number" min="0" value="${c.featsDone}"></div><div><label>Total feats</label><input id="cFeatsTotal" type="number" min="0" value="${c.featsTotal}"></div></div><div class="two"><div><label>Tickets earned</label><input id="cTickets" type="number" min="0" value="${c.tickets}"></div><div><label>Next reward threshold</label><input id="cNext" type="number" min="1" value="${c.nextTickets}"></div></div><label>Next Conquest start (when inactive)</label><input id="cStart" type="datetime-local" value="${c.nextStart?new Date(c.nextStart).toISOString().slice(0,16):''}"><div class="actions"><button class="btn" data-save-conquest>Save Conquest</button></div><div class="status warn">If the API doesn't provide ticket progress, use these manual values. Static thresholds live in <b>data/conquest.json</b>.</div></div>
 <div class="card"><b>Feat Assistant</b><div class="small">Foundation for roster-aware team recommendations. Future releases can add sector/feat-specific recommendations.</div></div><div class="card"><b>Session Tracking</b><div class="small">Use the fields above to record the current session; the synced account remains the source of truth where API data exists.</div></div>`},
 gac(){return `<div class="sectionHead"><h2>GAC Counters</h2></div><div class="card"><div class="filters"><select id="gacMode"><option>5v5</option><option>3v3</option><option>Fleets</option></select><input id="gacSearch" placeholder="Search opponent team…"></div></div><div class="card" id="gacList">${gacCounters.map(x=>`<div class="item gacItem" data-search="${esc((x[0]+' '+x[1]).toLowerCase())}"><div class="row"><div class="grow"><div class="name">${esc(x[0])}</div><div class="small">Counter: ${esc(x[1])}</div></div><span class="pill">Counter</span></div><div class="small">${esc(x[2])}</div></div>`).join('')}</div><div class="card"><b>Battle Planner & Stats</b><div class="small">Personal win/loss and battle notes can be recorded here as the account data becomes available.</div></div>`},
 events(){return `<div class="sectionHead"><h2>Events</h2></div><div class="card"><div class="small">Track event history and highlight events you want to complete when they return.</div><label>Event name</label><input id="eventName" placeholder="Event"><label><span class="check"><input id="eventWatch" type="checkbox"> Add to watchlist</span></label><div class="actions"><button class="btn" data-add-event>Add Event</button></div></div><div class="card">${state.events.map((e,i)=>`<div class="item"><div class="row"><div class="grow"><b>${esc(e.name)}</b><div class="small">${e.watch?'⭐ Watchlist':'History'} · ${esc(e.date||'')}</div></div><button class="btn danger" data-del-event="${i}">Remove</button></div></div>`).join('')||'<div class="empty">No events tracked yet.</div>'}</div>`},
 teams(){return `<div class="sectionHead"><h2>Team Builder</h2></div><div class="card"><div class="small">Save team ideas for GAC, Conquest and general use. Recommendations can feed this page.</div><label>Team name</label><input id="teamName" placeholder="e.g. Jabba squad"><label>Characters</label><input id="teamChars" placeholder="Character names separated by commas"><div class="actions"><button class="btn" data-add-team>Save Team</button></div></div><div class="card">${state.savedTeams.map((t,i)=>`<div class="item"><div class="row"><div class="grow"><b>${esc(t.name)}</b><div class="small">${esc(t.chars)}</div></div><button class="btn danger" data-del-team="${i}">Remove</button></div></div>`).join('')||'<div class="empty">No saved teams yet.</div>'}</div>`},
 search(){return `<div class="sectionHead"><h2>Global Search</h2></div><div class="card"><input id="globalSearch" placeholder="Search characters, journeys, teams, events…"></div><div id="searchResults" class="card"><div class="empty">Type to search.</div></div>`},
 history(){return `<div class="sectionHead"><h2>Progress History</h2></div><div class="card">${state.progressHistory.length?state.progressHistory.slice().reverse().map(x=>`<div class="item"><b>${esc(x.date)}</b><div class="small">${esc(x.summary)}</div></div>`).join(''):'<div class="empty">Progress history will populate after successful syncs.</div>'}</div><div class="card"><b>Sync Change History</b>${state.syncHistory.length?state.syncHistory.slice().reverse().map(x=>`<div class="item"><b>${esc(x.date)}</b><div class="small">${fmt(x.rosterCount)} roster units · GP ${fmt(x.gp)}</div></div>`).join(''):'<div class="empty">No successful syncs yet.</div>'}</div>`},
 settings(){return `<div class="card"><h2>Account & Sync</h2><label>Ally Code</label><input id="ally" inputmode="numeric" placeholder="337627356" value="${esc(state.allyCode)}"><div class="actions"><button class="btn" data-save-ally>Save Ally Code</button><button class="btn secondary" data-sync>Sync Now</button></div><div id="syncStatus" class="status">${state.lastSync?'Last successful sync: '+esc(state.lastSync):'Not synced yet.'}</div></div>
 <div class="card"><h2>Version History</h2>${versionHistory().map(v=>`<details class="item"><summary>${v.v}${v.v===`v${APP_VERSION}`?' — Current':''}</summary><div class="small">${esc(v.summary)}</div>${v.additions?.length?`<div class="small"><b>New:</b> ${esc(v.additions.join(' · '))}</div>`:''}${v.fixes?.length?`<div class="small"><b>Fixes:</b> ${esc(v.fixes.join(' · '))}</div>`:''}</details>`).join('')}</div>
 <div class="card"><h2>🚀 Upcoming Features</h2><div class="small">Edit <b>data/upcoming-features.json</b> in the repository. Roadmap changes do not require a new compile.</div><div id="upcoming">Loading…</div></div>
 <div class="card"><h2>Tools</h2><div class="grid"><div class="tile" data-page="search">SEARCH</div><div class="tile" data-page="history">PROGRESS HISTORY</div></div></div>
 <div class="card"><h2>Backup</h2><div class="actions"><button class="btn secondary" data-export>Export local data</button><button class="btn danger" data-reset>Reset local data</button></div></div>`}
};
function versionHistory(){return[
 {v:'v0.5',summary:'Major feature-complete release: multi-user sync architecture, dashboard redesign, Journey Progress, Conquest, GAC, Events, Resources, priorities, Team Builder, search, history and repository-editable roadmap.',additions:['Rolling What’s New banner','Square navigation tiles','GL + Solo Journeys','Conquest tickets/countdown','GAC counters','My Priorities','Global Search','Progress History','Version History','Upcoming Features'],fixes:['Reworked sync boundary','Persistent GP/Crystals header','Service-worker versioning']},
 {v:'v0.4',summary:'Existing PWA foundation: fixed navigation/buttons, local data, Ally Code account screen, experimental live SWGOH API sync, backup export and offline PWA cache.',additions:['Ally Code account screen','Experimental API sync','Backup export'],fixes:['Navigation/buttons']},
 {v:'v0.2',summary:'Private installable iPhone PWA prototype with Dashboard, character gear/relic/target tracking, resources, offline storage, export/import and Home Screen support.',additions:['Dashboard','Character gear/relic/target tracking','Resource tracking','Offline storage','Export/import','Home Screen support'],fixes:[]}
]}
function normalizeUnit(u){const id=String(u.definitionId||u.defId||u.id||'').replace(/:.*$/,'');return{id,name:u.name||id,currentTier:u.currentTier??u.gear??u.gearTier??0,relicTier:u.relic?.currentTier??u.relic?.tier??u.relicTier??0,ship:!!u.ship,isGL:!!u.isGL,isJourney:!!u.isJourney}}
function bind(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{tab=b.dataset.page;save();render()});
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const id=b.dataset.pin;state.pins=state.pins.includes(id)?state.pins.filter(x=>x!==id):[...state.pins,id];save();render()});
 document.querySelectorAll('[data-priority]').forEach(s=>s.onchange=()=>{state.priorityOverrides[s.dataset.priority]=s.value?Number(s.value):null;save();render()});
 const saveAlly=document.querySelector('[data-save-ally]');if(saveAlly)saveAlly.onclick=()=>{const v=document.getElementById('ally').value.replace(/\D/g,'');if(v.length!==9){alert('Ally Code must be exactly 9 digits.');return}state.allyCode=v;save();render()};
 const sync=document.querySelector('[data-sync]');if(sync)sync.onclick=syncNow;
 const sc=document.querySelector('[data-save-conquest]');if(sc)sc.onclick=()=>{state.conquest={...state.conquest,sector:document.getElementById('cSector').value,progress:pct(document.getElementById('cProgress').value),featsDone:Number(document.getElementById('cFeatsDone').value)||0,featsTotal:Number(document.getElementById('cFeatsTotal').value)||0,tickets:Number(document.getElementById('cTickets').value)||0,nextTickets:Number(document.getElementById('cNext').value)||2000,nextStart:document.getElementById('cStart').value?new Date(document.getElementById('cStart').value).toISOString():''};save();render()};
 const tc=document.querySelector('[data-toggle-conquest]');if(tc)tc.onclick=()=>{state.conquest.active=!state.conquest.active;save();render()};
 const ra=document.querySelector('[data-add-resource]');if(ra)ra.onclick=()=>{const n=document.getElementById('resourceName').value.trim(),q=Number(document.getElementById('resourceQty').value)||0;if(n){state.resources[n]=q;save();render()}};
 const ae=document.querySelector('[data-add-event]');if(ae)ae.onclick=()=>{const n=document.getElementById('eventName').value.trim();if(n){state.events.push({name:n,watch:document.getElementById('eventWatch').checked,date:new Date().toLocaleDateString()});save();render()}};
 document.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{state.events.splice(Number(b.dataset.delEvent),1);save();render()});
 const at=document.querySelector('[data-add-team]');if(at)at.onclick=()=>{const n=document.getElementById('teamName').value.trim(),c=document.getElementById('teamChars').value.trim();if(n){state.savedTeams.push({name:n,chars:c});save();render()}};
 document.querySelectorAll('[data-del-team]').forEach(b=>b.onclick=()=>{state.savedTeams.splice(Number(b.dataset.delTeam),1);save();render()});
 const cs=document.getElementById('charSearch');if(cs)cs.oninput=()=>{const q=cs.value.toLowerCase();document.querySelectorAll('.charItem').forEach(x=>x.style.display=x.dataset.name.includes(q)?'':'none')};
 const gs=document.getElementById('gacSearch');if(gs)gs.oninput=()=>{const q=gs.value.toLowerCase();document.querySelectorAll('.gacItem').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')};
 const g=document.getElementById('globalSearch');if(g)g.oninput=()=>{const q=g.value.toLowerCase().trim(),r=document.getElementById('searchResults');if(!q){r.innerHTML='<div class="empty">Type to search.</div>';return}const arr=[...journeys.map(x=>({n:x.name,t:x.type})),...rosterChars().map(x=>({n:x.name||x.id,t:'Character'})),...state.events.map(x=>({n:x.name,t:'Event'})),...state.savedTeams.map(x=>({n:x.name,t:'Team'}))].filter(x=>x.n.toLowerCase().includes(q));r.innerHTML=arr.length?arr.map(x=>`<div class="item"><b>${esc(x.n)}</b><div class="small">${esc(x.t)}</div></div>`).join(''):'<div class="empty">No results.</div>'};
 const ex=document.querySelector('[data-export]');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`swgoh-tracker-v${APP_VERSION}-backup.json`;a.click()};
 const re=document.querySelector('[data-reset]');if(re)re.onclick=()=>{if(confirm('Reset local v0.5 data?')){state={...defaults};save();render()}};
}
async function syncNow(){
 const code=(state.allyCode||'').replace(/\D/g,'');if(code.length!==9){alert('Save a 9-digit Ally Code first.');return}
 const box=document.getElementById('syncStatus');if(box)box.textContent='Syncing Ally Code through the configured backend…';
 try{
  const base=window.SWGOH_CONFIG?.API_BASE||'/api';
  const r=await fetch(base.replace(/\/$/,'')+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allyCode:code})});
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();if(!d.allyCode||String(d.allyCode).replace(/\D/g,'')!==code)throw new Error('Backend returned a different Ally Code.');
  const old=state.roster.length;state.profile=d.profile||null;state.roster=(d.roster||[]).map(normalizeUnit);state.crystals=d.crystals??state.crystals;state.lastSync=new Date().toLocaleString();
  state.syncHistory.push({date:state.lastSync,rosterCount:state.roster.length,gp:state.profile?.gp??state.profile?.galacticPower??0});
  state.progressHistory.push({date:state.lastSync,summary:`Successful roster sync: ${state.roster.length} units${old!==state.roster.length?` (${old} previously)`:''}.`});
  save();render();
 }catch(e){if(box){box.className='status bad';box.textContent='Sync failed: '+e.message+'. The backend/Comlink service must be deployed and configured.'}}
}
function startNews(){let i=0;const el=document.getElementById('news');const tick=()=>{el.innerHTML=newsItems[i++%newsItems.length]};tick();clearInterval(newsTimer);newsTimer=setInterval(tick,5000);el.onclick=()=>{tab='settings';save();render();document.querySelector('.card:nth-of-type(2)')?.scrollIntoView({behavior:'smooth'})}}
function loadUpcoming(){fetch('./data/upcoming-features.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{const el=document.getElementById('upcoming');if(el)el.innerHTML=items.map(x=>`<div class="item"><div class="row"><div class="grow"><b>${esc(x.title)}</b><div><span class="chip">${esc(x.status)}</span></div><div class="small">${esc(x.description)}</div></div></div></div>`).join('')}).catch(()=>{})}
render();startNews();loadUpcoming();
setInterval(()=>{const c=document.getElementById('dashCountdown');if(c&& !state.conquest.active)c.textContent=nextConquest()},60000);
})();
</script>
