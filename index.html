<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png">
<title>SWGOH Tracker v0.6</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--nav:#0b1020;--accent:#2563eb;--good:#15803d;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{margin:0;font-size:25px;line-height:1.05}.version{color:#aeb8ca;font-size:12px;margin-top:4px}.accountStats{text-align:right;font-size:12px;color:#d5dbea}.accountStats b{font-size:15px;color:#fff}
.news{margin-top:11px;background:#18233d;border:1px solid #2b3b60;border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;cursor:pointer}.ticker{display:inline-block;padding-left:100%;animation:ticker 18s linear infinite}.news:hover .ticker{animation-play-state:paused}@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.main{padding:14px 14px 96px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}
.hero{padding:16px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.sectionHead h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:104px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:750;font-size:15px;box-shadow:0 1px 2px #00000008;cursor:pointer}.tile:active{transform:scale(.98)}
.stat{font-size:27px;font-weight:800}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.pill,.chip{display:inline-block;background:#eaf0ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.chip{margin-top:4px}
.bar{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eaf0ff;color:#1d4ed8}.danger{background:#fee2e2;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.name{font-weight:750}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:10px;font-size:12px}.status.good{background:#ecfdf3;color:#166534}.status.warn{background:#fffbeb;color:#92400e}.status.bad{background:#fef2f2;color:#991b1b}
.empty{text-align:center;padding:24px;color:var(--muted)}details summary{cursor:pointer;font-weight:750}.notice{border-left:4px solid var(--accent);padding-left:10px}.rank{font-size:11px;color:var(--muted);font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;padding:9px 3px;color:#667085;font-size:10px;cursor:pointer}.nav button span{display:block;font-size:18px;margin-bottom:2px}.nav button.active{color:#1d4ed8;font-weight:800}
@media(max-width:520px){.grid{gap:9px}.tile{min-height:92px;font-size:13px}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header><div class="top"><div class="brand"><h1>SWGOH Tracker</h1><div class="version">v0.6</div></div><div class="accountStats"><div>GP <b id="gp">—</b></div><div>💎 <b id="crystals">—</b></div></div></div><div class="news" id="news"></div></header>
<main class="main" id="app"></main><div class="nav" id="nav"></div>
<script src="./config.js"></script>
<script>
(()=>{'use strict';
const KEY='swgoh-tracker-v052', APP_VERSION='0.6';
const defaults={allyCode:'',profile:null,roster:[],lastSync:'',syncHistory:[],crystals:null,tab:'dashboard',pins:[],priorityOverrides:{},resources:{},events:[],savedTeams:[],conquest:{active:false,progress:0,tickets:0,nextTickets:2000,sector:'—',featsDone:0,featsTotal:0,nextStart:''}};
let state=load(),tab=state.tab||'dashboard';
const nav=[['dashboard','▦','Dashboard'],['gl','★','GL'],['conquest','🎯','Conquest'],['gac','⚔','GAC'],['settings','⚙','Settings']];
const journeys=[
{id:'slkr',name:'Supreme Leader Kylo Ren',type:'GL'},{id:'rey',name:'Rey',type:'GL'},{id:'jml',name:'Jedi Master Luke Skywalker',type:'GL'},{id:'jmk',name:'Jedi Master Kenobi',type:'GL'},{id:'lv',name:'Lord Vader',type:'GL'},{id:'jabba',name:'Jabba the Hutt',type:'GL'},{id:'leia',name:'Leia Organa',type:'GL'},{id:'ph',name:'Pirate King Hondo Ohnaka',type:'GL'},
{id:'aphra',name:'Doctor Aphra',type:'Solo'},{id:'executor',name:'Executor',type:'Solo'},{id:'profundity',name:'Profundity',type:'Solo'},{id:'raddus',name:'Raddus',type:'Solo'}
];
const gacCounters=[['Jabba the Hutt','Leia Organa'],['Lord Vader','Jedi Master Kenobi'],['Supreme Leader Kylo Ren','Jabba the Hutt'],['Rey','Supreme Leader Kylo Ren'],['General Skywalker','Darth Revan'],['Executor','Profundity'],['Profundity','Executor']];
const news=['🆕 v0.6 — Render-hosted backend foundation','☁️ Python API deployed and health check verified','🔐 SWGOH.GG API application request submitted','🔄 Roster sync validation in progress','📌 Existing tracker features and local roster cache retained'];
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){state.tab=tab;localStorage.setItem(KEY,JSON.stringify(state))}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return n==null||n===''?'—':Number(n).toLocaleString()} function pct(n){return Math.max(0,Math.min(100,Math.round(Number(n)||0)))}
function chars(){return state.roster.filter(x=>!x.ship)}
function progress(x){if(x.progress!=null)return pct(x.progress);return pct((Number(x.currentTier||0)/13)*70+(Number(x.relicTier||0)/9)*30)}
function journeyItems(type){return journeys.filter(j=>type==='all'||j.type===type).map(j=>{let r=state.roster.find(x=>x.name&&x.name.toLowerCase()===j.name.toLowerCase());return {...j,roster:r,progress:r?progress(r):0,pinned:state.pins.includes(j.id),override:state.priorityOverrides[j.id]??null}})}
function sorted(type){return journeyItems(type).sort((a,b)=>{let ao=a.override??0,bo=b.override??0;if(ao!==bo)return bo-ao;if(a.pinned!==b.pinned)return b.pinned-a.pinned;if((a.progress===100)!=(b.progress===100))return a.progress===100?1:-1;return b.progress-a.progress})}
function pageNav(p){tab=p;save();render()}
function render(){
document.getElementById('app').innerHTML=pages[tab]();
document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>pageNav(b.dataset.tab));
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>pageNav(b.dataset.page));bind();
document.getElementById('gp').textContent=fmt(state.profile?.gp??state.profile?.galacticPower);
document.getElementById('crystals').textContent=fmt(state.crystals);
if(tab==='settings')loadUpcoming();
}
function progressCard(){let j=sorted('GL').find(x=>x.progress<100)||sorted('GL')[0];return `<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>📌 Journey Progress</h2><span class="pill">${j?pct(j.progress):0}%</span></div><div class="name">${esc(j?.name||'No journey selected')}</div><div class="small">${state.pins.length?'Pinned: '+state.pins.map(id=>esc(journeys.find(x=>x.id===id)?.name||id)).join(', '):'Automatic highest-priority journey. Pin multiple journeys below.'}</div><div class="bar"><i style="width:${pct(j?.progress)}%"></i></div><div class="actions"><button class="btn secondary" data-page="gl">View detailed needs</button><button class="btn secondary" data-page="settings">Account & Sync</button></div></div>`}
const pages={
dashboard(){return `${progressCard()}<div class="card hero"><div class="sectionHead" style="margin-top:0"><h2>🎯 Conquest</h2><span class="pill">${state.conquest.active?pct(state.conquest.progress)+'%':'Not active'}</span></div><div class="small">Tickets: ${fmt(state.conquest.tickets)} · Next threshold: ${fmt(state.conquest.nextTickets)}</div><div class="actions"><button class="btn secondary" data-page="conquest">Open Conquest Planner</button></div></div><div class="sectionHead"><h2>Tracker</h2></div><div class="grid">${[['gl','GALACTIC LEGENDS'],['events','EVENTS'],['resources','RESOURCES'],['conquest','CONQUEST PLANNER'],['solo','SOLO JOURNEYS'],['gac','GAC COUNTERS'],['characters','CHARACTERS'],['teams','TEAMS']].map(x=>`<div class="tile" data-page="${x[0]}">${x[1]}</div>`).join('')}</div>`},
gl(){return journeyPage('Galactic Legends','Roster-driven GL progress. Completed journeys go to the bottom; highest progress first.','GL')},
solo(){return journeyPage('Solo Journeys','Independent journey and ship progression.','Solo')},
priorities(){let l=sorted('all');return `<div class="sectionHead"><h2>My Priorities</h2></div><div class="card"><div class="small">Automatic ranking uses progress, pins and completion. Manual overrides take precedence.</div></div><div class="card">${l.map((j,i)=>`<div class="item"><div class="row"><div class="grow"><span class="rank">#${i+1}</span> <span class="name">${esc(j.name)}</span><div class="small">${j.type} · ${j.progress}%</div></div><select data-priority="${j.id}"><option value="">Automatic</option><option value="100" ${j.override===100?'selected':''}>Highest</option><option value="80" ${j.override===80?'selected':''}>High</option><option value="50" ${j.override===50?'selected':''}>Medium</option><option value="20" ${j.override===20?'selected':''}>Low</option></select></div></div>`).join('')}</div>`},
characters(){return `<div class="sectionHead"><h2>Characters</h2></div><div class="card">${chars().length?chars().map(x=>`<div class="item"><div class="row"><div class="grow"><div class="name">${esc(x.name||x.id)}</div><div class="small">Gear ${esc(x.currentTier??'—')} · Relic ${esc(x.relicTier??0)}</div></div><span class="pill">${progress(x)}%</span></div><div class="bar"><i style="width:${progress(x)}%"></i></div></div>`).join(''):'<div class="empty">Sync your Ally Code to populate your roster.</div>'}</div>`},
resources(){return `<div class="sectionHead"><h2>Resources</h2></div><div class="card"><div class="notice"><b>Automatic roster sync</b><div class="small">Public sync covers roster/account data. Private inventory remains manual until a proper authenticated provider is available.</div></div><label>Resource</label><input id="resourceName" placeholder="e.g. Kyrotech Shock Prod"><label>Quantity</label><input id="resourceQty" type="number" min="0"><div class="actions"><button class="btn" data-add-resource>Add Resource</button></div></div><div class="card">${Object.entries(state.resources).map(([k,v])=>`<div class="item row"><b class="grow">${esc(k)}</b><span class="pill">${fmt(v)}</span></div>`).join('')||'<div class="empty">No manually tracked resources.</div>'}</div>`},
conquest(){let c=state.conquest;return `<div class="sectionHead"><h2>Conquest Planner</h2><button class="btn secondary" data-toggle-conquest>${c.active?'Set inactive':'Set active'}</button></div><div class="card"><div class="three"><div><div class="small">Progress</div><div class="stat">${c.active?pct(c.progress)+'%':'—'}</div></div><div><div class="small">Tickets</div><div class="stat">${fmt(c.tickets)}</div></div><div><div class="small">Next</div><div class="stat">${fmt(c.nextTickets)}</div></div></div><label>Sector</label><input id="cSector" value="${esc(c.sector)}"><label>Progress %</label><input id="cProgress" type="number" min="0" max="100" value="${pct(c.progress)}"><div class="two"><div><label>Feats completed</label><input id="cFeatsDone" type="number" value="${c.featsDone}"></div><div><label>Total feats</label><input id="cFeatsTotal" type="number" value="${c.featsTotal}"></div></div><div class="two"><div><label>Tickets</label><input id="cTickets" type="number" value="${c.tickets}"></div><div><label>Next threshold</label><input id="cNext" type="number" value="${c.nextTickets}"></div></div><div class="actions"><button class="btn" data-save-conquest>Save Conquest</button></div></div>`},
gac(){return `<div class="sectionHead"><h2>GAC Counters</h2></div><div class="card">${gacCounters.map(x=>`<div class="item"><div class="name">${esc(x[0])}</div><div class="small">Counter: ${esc(x[1])}</div></div>`).join('')}</div>`},
events(){return `<div class="sectionHead"><h2>Events</h2></div><div class="card"><label>Event name</label><input id="eventName"><label><input id="eventWatch" type="checkbox"> Add to watchlist</label><div class="actions"><button class="btn" data-add-event>Add Event</button></div></div><div class="card">${state.events.map((e,i)=>`<div class="item row"><div class="grow"><b>${esc(e.name)}</b><div class="small">${e.watch?'⭐ Watchlist':'History'} · ${esc(e.date)}</div></div><button class="btn danger" data-del-event="${i}">Remove</button></div>`).join('')||'<div class="empty">No events tracked.</div>'}</div>`},
teams(){return `<div class="sectionHead"><h2>Team Builder</h2></div><div class="card"><label>Team name</label><input id="teamName"><label>Characters</label><input id="teamChars" placeholder="Names separated by commas"><div class="actions"><button class="btn" data-add-team>Save Team</button></div></div><div class="card">${state.savedTeams.map((t,i)=>`<div class="item row"><div class="grow"><b>${esc(t.name)}</b><div class="small">${esc(t.chars)}</div></div><button class="btn danger" data-del-team="${i}">Remove</button></div>`).join('')||'<div class="empty">No saved teams.</div>'}</div>`},
settings(){return `<div class="card"><h2>Account & Sync</h2><label>Ally Code</label><input id="ally" inputmode="numeric" placeholder="337627356" value="${esc(state.allyCode)}"><div class="actions"><button class="btn" data-save-ally>Save Ally Code</button><button class="btn secondary" data-sync>Sync Now</button></div><div id="syncStatus" class="status">${state.lastSync?'🟢 Last successful sync: '+esc(state.lastSync):'🟠 Not synced yet.'}</div></div>
<div class="card"><h2>Version History</h2>${versionHistory().map(v=>`<details class="item"><summary>${v.icon} ${v.v}${v.v===`v${APP_VERSION}`?' — Current':''}</summary><ul>${v.items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`).join('')}</div>
<div class="card"><h2>🚀 Upcoming Features</h2><div class="small">Edit <b>data/upcoming-features.json</b>; the app renders its contents automatically.</div><div id="upcoming">Loading…</div></div>
<div class="card"><h2>Backup</h2><div class="actions"><button class="btn secondary" data-export>Export local data</button><button class="btn danger" data-reset>Reset local data</button></div></div>`}
};
function journeyPage(title,desc,type){let l=sorted(type);return `<div class="sectionHead"><h2>${title}</h2><button class="btn secondary" data-page="priorities">Priorities</button></div><div class="card"><div class="small">${desc}</div></div><div class="card">${l.map((j,i)=>`<details class="item" ${i===0?'open':''}><summary><span class="row"><span class="grow">${j.pinned?'📌 ':''}<span class="name">${esc(j.name)}</span><span class="pill">${j.progress}%</span></span></summary><div class="small">${j.roster?'Found in synced roster.':'Not currently identified in synced roster.'}</div><div class="bar"><i style="width:${j.progress}%"></i></div><div class="actions"><button class="btn secondary" data-pin="${j.id}">${j.pinned?'Unpin':'Pin'}</button><button class="btn secondary" data-page="resources">View resource needs</button></div></details>`).join('')}</div>`}
function versionHistory(){return[
{v:'v0.6',icon:'☁️',items:['Major change: introduced a separately hosted Python backend on Render; the GitHub Pages app remains a static frontend','Deployment: Render Blueprint created from the render-backend-fix branch; service deployed in Frankfurt','Diagnostics: /api/health endpoint deployed and verified successfully; backend reports version 0.6','Integration: backend currently targets public SWGOH.GG profile and character-roster data','Access: SWGOH.GG API application request submitted; approval and credentials are pending','Known issue: live roster sync currently receives HTTP 403 from the SWGOH.GG character-roster page; successful GP and roster retrieval is not yet validated','Next: implement approved API access if granted, configure credentials securely in Render environment variables, then retest GP and roster sync','Limitations: public profile access does not provide private inventory, unequipped materials or crystal balances','Safety: changes remain on the render-backend-fix branch; main and the live GitHub Pages app have not been changed']},

{v:'v0.5',icon:'🚀',items:['Dashboard redesign and persistent GP/Crystals header','Journey Progress, Conquest, GAC, Events, Resources and Priorities foundations','Square navigation tiles','Repository-editable Upcoming Features']},
{v:'v0.4',icon:'🛠️',items:['PWA foundation, navigation and Ally Code account screen','Experimental backend sync boundary and local data']},
{v:'v0.3',icon:'ℹ️',items:['Not released']},
{v:'v0.2',icon:'📱',items:['Initial installable iPhone PWA prototype','Dashboard, character gear/relic tracking, resources and local storage']}
]}
function bind(){
document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{let id=b.dataset.pin;state.pins=state.pins.includes(id)?state.pins.filter(x=>x!==id):[...state.pins,id];save();render()});
document.querySelectorAll('[data-priority]').forEach(s=>s.onchange=()=>{state.priorityOverrides[s.dataset.priority]=s.value?Number(s.value):null;save();render()});
let a=document.querySelector('[data-save-ally]');if(a)a.onclick=()=>{let v=document.getElementById('ally').value.replace(/\D/g,'');if(v.length!==9)return alert('Ally Code must be 9 digits.');state.allyCode=v;save();render()};
let sy=document.querySelector('[data-sync]');if(sy)sy.onclick=syncNow;
let tc=document.querySelector('[data-toggle-conquest]');if(tc)tc.onclick=()=>{state.conquest.active=!state.conquest.active;save();render()};
let sc=document.querySelector('[data-save-conquest]');if(sc)sc.onclick=()=>{let c=state.conquest;c.sector=document.getElementById('cSector').value;c.progress=pct(document.getElementById('cProgress').value);c.featsDone=Number(document.getElementById('cFeatsDone').value)||0;c.featsTotal=Number(document.getElementById('cFeatsTotal').value)||0;c.tickets=Number(document.getElementById('cTickets').value)||0;c.nextTickets=Number(document.getElementById('cNext').value)||2000;save();render()};
let ar=document.querySelector('[data-add-resource]');if(ar)ar.onclick=()=>{let n=document.getElementById('resourceName').value.trim(),q=Number(document.getElementById('resourceQty').value)||0;if(n){state.resources[n]=q;save();render()}};
let ae=document.querySelector('[data-add-event]');if(ae)ae.onclick=()=>{let n=document.getElementById('eventName').value.trim();if(n){state.events.push({name:n,watch:document.getElementById('eventWatch').checked,date:new Date().toLocaleDateString()});save();render()}};
document.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{state.events.splice(+b.dataset.delEvent,1);save();render()});
let at=document.querySelector('[data-add-team]');if(at)at.onclick=()=>{let n=document.getElementById('teamName').value.trim(),c=document.getElementById('teamChars').value.trim();if(n){state.savedTeams.push({name:n,chars:c});save();render()}};
document.querySelectorAll('[data-del-team]').forEach(b=>b.onclick=()=>{state.savedTeams.splice(+b.dataset.delTeam,1);save();render()});
let ex=document.querySelector('[data-export]');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='swgoh-tracker-backup.json';a.click()};
let re=document.querySelector('[data-reset]');if(re)re.onclick=()=>{if(confirm('Reset local data?')){state={...defaults};save();render()}};
}
async function syncNow(){
let code=(state.allyCode||'').replace(/\D/g,'');if(code.length!==9)return alert('Save a 9-digit Ally Code first.');
let box=document.getElementById('syncStatus');if(box){box.className='status warn';box.textContent='🔄 Syncing public SWGOH.GG data…'}
try{let base=(window.SWGOH_CONFIG?.API_BASE||'/api').replace(/\/$/,'');let r;try{r=await fetch(base+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allyCode:code})})}catch(networkError){throw new Error('Could not reach the sync service. Check the Render URL in config.js and try again.')}let raw=await r.text();let d;try{d=raw?JSON.parse(raw):{}}catch(parseError){throw new Error('The sync service returned a webpage instead of JSON. Check that API_BASE points to the Render service URL ending in /api.')}if(!r.ok)throw new Error(d.detail||d.message||('Sync service returned HTTP '+r.status));state.profile=d.profile||null;state.roster=d.roster||[];state.crystals=d.crystals??state.crystals;state.lastSync=new Date().toLocaleString();state.syncHistory.push({date:state.lastSync,rosterCount:state.roster.length,gp:state.profile?.gp||0});save();render()}catch(e){if(box){box.className='status bad';box.textContent='❌ Sync failed: '+e.message}}}
async function loadUpcoming(){try{let r=await fetch('./data/upcoming-features.json',{cache:'no-store'});let items=await r.json();let el=document.getElementById('upcoming');if(el)el.innerHTML=items.map(x=>`<div class="item"><b>${esc(x.title)}</b><div><span class="chip">${esc(x.status)}</span></div><div class="small">${esc(x.description)}</div></div>`).join('')}catch(e){let el=document.getElementById('upcoming');if(el)el.innerHTML='<div class="status bad">Unable to load upcoming-features.json.</div>'}}
function startNews(){let el=document.getElementById('news');el.innerHTML='<span class="ticker">'+news.join(' &nbsp; • &nbsp; ')+'</span>';el.onclick=()=>pageNav('settings')}
render();startNews();
})();
</script></body></html>
