<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SWGOH Tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>SWGOH Tracker v0.6</title><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--nav:#0b1020;--soft:#eaf0ff;--good:#ecfdf3;--bad:#fef2f2;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;position:sticky;top:0;z-index:4}header h1{margin:0;font-size:23px}.sub{font-size:12px;color:#b9c2d0;margin-top:2px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.statbox{background:#151c31;border:1px solid #29324c;border-radius:12px;padding:8px 10px}.statbox b{display:block;font-size:16px}.statbox span{font-size:10px;color:#aeb8ca}main{max-width:820px;margin:auto;padding:12px 13px 100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;text-align:left;min-height:105px;cursor:pointer}.tile strong{display:block;font-size:15px;margin-top:8px}.tile span{font-size:12px;color:var(--muted)}.icon{font-size:25px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}.head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0 0 5px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.small{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--blue);color:white;font-weight:650;cursor:pointer}.secondary{background:var(--soft);color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.gold{background:#fff7df;color:#9a6700}.pill{background:var(--soft);color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}progress{width:100%;height:8px;margin-top:7px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:9px;font-size:12px}.ok{background:var(--good);color:#166534}.bad{background:var(--bad);color:#991b1b}.empty{text-align:center;color:var(--muted);padding:24px}.journey{border:2px solid #dbe6ff;background:linear-gradient(135deg,#fff,#f5f8ff)}.star{color:var(--gold);font-size:18px}.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.counter .card{margin:0;text-align:center}.counter b{font-size:22px;display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(env(safe-area-inset-bottom) + 5px);z-index:5}nav button{border:0;background:none;color:#667085;font-size:10px;padding:5px 2px}nav button.active{color:var(--blue);font-weight:700}nav span{display:block;font-size:18px;margin-bottom:2px}.badge{display:inline-block;background:#111827;color:#fff;border-radius:6px;padding:2px 5px;font-size:10px;margin-left:4px}.mutedline{height:1px;background:var(--line);margin:10px 0}
</style></head><body><header><h1>SWGOH Tracker</h1><div class="sub">v0.6 · personal roster, priorities & journey tracker</div><div class="stats"><div class="statbox"><b id="gp">—</b><span>Galactic Power</span></div><div class="statbox"><b id="crystals">—</b><span>Crystals</span></div></div></header><main id="app"></main><nav><button data-tab="dashboard"><span>▦</span>Dashboard</button><button data-tab="characters"><span>♟</span>Roster</button><button data-tab="journeys"><span>★</span>Journeys</button><button data-tab="gac"><span>⚔</span>GAC</button><button data-tab="settings"><span>⚙</span>Settings</button></nav><script>
(function(){'use strict';const KEY='swgoh-v06';let tab='dashboard';let state=load();
const defaultJourneys=[
{name:'Jedi Master Luke Skywalker',type:'Galactic Legend',group:'GL',target:'JMLS',progress:0,pinned:false,active:false},
{name:'Rey',type:'Galactic Legend',group:'GL',target:'Rey',progress:0,pinned:false,active:false},
{name:'Supreme Leader Kylo Ren',type:'Galactic Legend',group:'GL',target:'SLKR',progress:0,pinned:false,active:false},
{name:'Lord Vader',type:'Galactic Legend',group:'GL',target:'LV',progress:0,pinned:true,active:true},
{name:'Jabba the Hutt',type:'Galactic Legend',group:'GL',target:'Jabba',progress:0,pinned:false,active:false},
{name:'Leia Organa',type:'Galactic Legend',group:'GL',target:'Leia',progress:0,pinned:false,active:false},
{name:'Bo-Katan (Mand’alor)',type:'Galactic Legend',group:'GL',target:'Bo-Katan',progress:0,pinned:false,active:false},
{name:'The Mandalorian (Beskar Armor)',type:'Solo Journey',group:'Solo',target:'BAM',progress:0,pinned:false,active:false},
{name:'Commander Luke Skywalker',type:'Solo Journey',group:'Solo',target:'CLS',progress:0,pinned:false,active:false},
{name:'Starkiller',type:'Solo Journey',group:'Solo',target:'Starkiller',progress:0,pinned:false,active:false},
{name:'C-3PO',type:'Solo Journey',group:'Solo',target:'C3PO',progress:0,pinned:false,active:false},
{name:'Chewbacca',type:'Solo Journey',group:'Solo',target:'Chewbacca',progress:0,pinned:false,active:false},
{name:'R2-D2',type:'Solo Journey',group:'Solo',target:'R2D2',progress:0,pinned:false,active:false},
{name:'Thrawn',type:'Solo Journey',group:'Solo',target:'Thrawn',progress:0,pinned:false,active:false}
];
function base(){return{allyCode:'',profile:null,lastSync:'',syncHistory:[],characters:[],resources:[{name:'Crystals',amount:0,target:5000},{name:'Kyrotech',amount:0,target:400},{name:'Signal Data',amount:0,target:300},{name:'Carbonite Circuit Boards',amount:0,target:100},{name:'Bronzium Wiring',amount:0,target:100}],journeys:defaultJourneys,gac:{attackWins:0,attackLosses:0,defenseWins:0,defenseLosses:0},priorities:{}}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return Object.assign(base(),x)}catch(e){}return base()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(c){return Math.min(100,Math.max(0,Math.round((+c.relic||0)/(+c.target||1)*100)))}function rp(r){return Math.min(100,Math.max(0,Math.round((+r.amount||0)/(+r.target||1)*100)))}function priority(c,i){let manual=state.priorities[c.name];if(manual!=null)return +manual;return 100-pct(c)}function render(){let a=document.getElementById('app');a.innerHTML={dashboard,dash:dash,characters:chars,journeys:journeys,gac:gac,settings:settings}[tab]?.()||dash();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}});bind();updateHeader()}function updateHeader(){let gp=state.profile?.gp??state.profile?.galacticPower??0;let cr=state.profile?.crystals??state.profile?.crystalCount??0;document.getElementById('gp').textContent=gp?Number(gp).toLocaleString():'—';document.getElementById('crystals').textContent=cr?Number(cr).toLocaleString():'—'}
function dash(){let pinned=state.journeys.find(j=>j.pinned)||state.journeys.find(j=>j.active);let top=state.characters.slice().sort((a,b)=>priority(b)-priority(a)).slice(0,5);return `<div class="grid"><div class="tile" data-go="characters"><div class="icon">♟</div><strong>My Roster</strong><span>${state.characters.length} characters tracked</span></div><div class="tile" data-go="journeys"><div class="icon">★</div><strong>Journeys</strong><span>${state.journeys.filter(j=>j.pinned||j.active).length} pinned/active</span></div><div class="tile" data-go="gac"><div class="icon">⚔</div><strong>GAC</strong><span>${state.gac.attackWins} attack wins</span></div><div class="tile" data-go="settings"><div class="icon">↻</div><strong>Sync</strong><span>${state.lastSync?'Last synced '+esc(state.lastSync):'Link Ally Code'}</span></div></div><div class="head"><h2>Current Journey</h2></div>${pinned?journeyCard(pinned,true):'<div class="card empty">Pin a journey to keep it here.</div>'}<div class="head"><h2>My Priorities</h2><button class="btn secondary" data-go="characters">Manage</button></div><div class="card">${top.length?top.map((c,i)=>charLine(c,i)).join(''):'<div class="empty">Sync your roster or add characters manually.</div>'}</div><div class="head"><h2>Resources</h2><button class="btn secondary" data-go="settings">Manage</button></div><div class="card">${state.resources.slice(0,4).map(r=>resourceLine(r)).join('')}</div>`}
function charLine(c,i){return `<div class="item"><div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="small">R${c.relic||0} → R${c.target||5} · ${c.gear||0}/13</div></div><span class="pill">${pct(c)}%</span></div><progress max="100" value="${pct(c)}"></progress></div>`}function resourceLine(r){return `<div class="item"><div class="row"><div class="grow"><b>${esc(r.name)}</b><div class="small">${Number(r.amount||0).toLocaleString()} / ${Number(r.target||0).toLocaleString()}</div></div><span class="pill">${rp(r)}%</span></div><progress max="100" value="${rp(r)}"></progress></div>`}
function chars(){return `<div class="head"><h2>My Priorities</h2><button class="btn" data-add="char">+ Add</button></div><div class="card"><div class="filters"><select id="sort"><option value="priority">Priority</option><option value="name">Name</option><option value="relic">Relic</option></select><select id="filter"><option value="all">All</option><option value="unfinished">Unfinished</option><option value="relic5">R5+</option><option value="relic7">R7+</option></select></div></div><div id="charlist" class="card">${renderCharList()}</div>`}function renderCharList(){let sort=document.getElementById('sort')?.value||'priority',filter=document.getElementById('filter')?.value||'all',a=state.characters.filter(c=>filter==='all'||filter==='unfinished'?(filter==='all'||pct(c)<100):filter==='relic5'?+c.relic>=5:+c.relic>=7);a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name):sort==='relic'?y.relic-x.relic:priority(y)-priority(x));return a.length?a.map((c,i)=>`<div class="item"><div class="row"><div class="grow"><b>${esc(c.name)}</b>${state.priorities[c.name]!=null?'<span class="badge">MANUAL</span>':''}<div class="small">Gear ${c.gear||0} · R${c.relic||0} → R${c.target||5}</div></div><span class="pill">P${Math.round(priority(c))}</span></div><progress max="100" value="${pct(c)}"></progress><div class="actions"><button class="btn secondary" data-edit="${state.characters.indexOf(c)}">Edit</button><button class="btn gold" data-priority="${state.characters.indexOf(c)}">Manual Priority</button><button class="btn danger" data-del="${state.characters.indexOf(c)}">Delete</button></div></div>`).join(''):'<div class="empty">No matching characters.</div>'}
function journeys(){let filter=document.getElementById('jfilter')?.value||'all',sort=document.getElementById('jsort')?.value||'pinned';let a=state.journeys.filter(j=>filter==='all'||j.group===filter);a.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name):sort==='progress'?y.progress-x.progress:(y.pinned?1:0)-(x.pinned?1:0));return `<div class="head"><h2>Journeys</h2></div><div class="card"><div class="filters"><select id="jfilter"><option value="all">All journeys</option><option value="GL">Galactic Legends</option><option value="Solo">Solo Journeys</option></select><select id="jsort"><option value="pinned">Pinned first</option><option value="progress">Progress</option><option value="name">Name</option></select></div></div>${a.map(j=>journeyCard(j,false)).join('')}`}
function journeyCard(j,hero){return `<div class="card journey"><div class="row"><div class="grow"><h3>${j.pinned?'<span class="star">★</span> ':''}${esc(j.name)}</h3><div class="small">${esc(j.type)} · ${j.progress}% complete</div></div><button class="btn ${j.pinned?'gold':'secondary'}" data-pin="${state.journeys.indexOf(j)}">${j.pinned?'Pinned':'Pin'}</button></div><progress max="100" value="${j.progress}"></progress><div class="actions"><button class="btn secondary" data-jprog="${state.journeys.indexOf(j)}">Update progress</button><button class="btn" data-active="${state.journeys.indexOf(j)}">${j.active?'Active':'Set Active'}</button></div></div>`}
function gac(){let g=state.gac;let att=g.attackWins+g.attackLosses,def=g.defenseWins+g.defenseLosses;return `<div class="head"><h2>GAC Counters</h2><button class="btn secondary" data-resetgac="1">Reset</button></div><div class="counter"><div class="card"><b>${g.attackWins}</b><span class="small">Attack Wins</span></div><div class="card"><b>${g.attackLosses}</b><span class="small">Attack Losses</span></div><div class="card"><b>${g.defenseWins}</b><span class="small">Defense Wins</span></div></div><div class="card"><h3>Attack</h3><div class="small">${att?Math.round(g.attackWins/att*100):0}% win rate</div><div class="actions"><button class="btn" data-gac="attackWins">+ Win</button><button class="btn danger" data-gac="attackLosses">+ Loss</button></div></div><div class="card"><h3>Defense</h3><div class="small">${def?Math.round(g.defenseWins/def*100):0}% win rate</div><div class="actions"><button class="btn" data-gac="defenseWins">+ Win</button><button class="btn danger" data-gac="defenseLosses">+ Loss</button></div></div><div class="card"><h3>Round notes</h3><input id="gacnote" placeholder="Optional note, opponent, strategy…"><div class="actions"><button class="btn" data-note="1">Save Note</button></div>${(g.notes||[]).slice().reverse().map(n=>`<div class="item"><b>${esc(n.text)}</b><div class="small">${esc(n.date)}</div></div>`).join('')}</div>`}
function settings(){return `<div class="card"><h2>SWGOH Account Sync</h2><p class="small">Your Ally Code is stored locally. v0.6 keeps a sync history and roster cache so the app remains useful between syncs.</p><input id="ally" inputmode="numeric" value="${esc(state.allyCode)}" placeholder="337627356"><div class="actions"><button class="btn" data-link="1">Save Ally Code</button><button class="btn secondary" data-sync="1">Sync Now</button></div><div id="status" class="status ${state.profile?'ok':''}">${state.profile?'Roster cached · Last sync '+esc(state.lastSync):'Not synced yet.'}</div></div>${state.syncHistory.length?`<div class="card"><h2>Sync History</h2>${state.syncHistory.slice().reverse().slice(0,10).map(h=>`<div class="item"><b>${esc(h.date)}</b><div class="small">GP ${Number(h.gp||0).toLocaleString()} · ${h.rosterCount||0} roster entries</div></div>`).join('')}</div>`:''}<div class="card"><h2>Resources</h2>${state.resources.map((r,i)=>`<div class="item"><div class="row"><div class="grow"><b>${esc(r.name)}</b><div class="small">${Number(r.amount).toLocaleString()} / ${Number(r.target).toLocaleString()}</div></div><button class="btn secondary" data-res="${i}">Edit</button></div></div>`).join('')}</div><div class="card"><h2>Backup</h2><div class="actions"><button class="btn secondary" data-export="1">Export JSON</button><button class="btn danger" data-reset="1">Reset Local Data</button></div></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.characters.push({name:'New Character',gear:1,relic:0,target:5});save();render();editChar(state.characters.length-1)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editChar(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this character?')){state.characters.splice(+b.dataset.del,1);save();render()}});document.querySelectorAll('[data-priority]').forEach(b=>b.onclick=()=>{let c=state.characters[+b.dataset.priority],v=prompt('Manual priority 0-100 (leave blank to return to automatic ranking)',state.priorities[c.name]??'');if(v===null)return;if(v.trim()==='')delete state.priorities[c.name];else state.priorities[c.name]=Math.max(0,Math.min(100,+v));save();render()});['sort','filter','jfilter','jsort'].forEach(id=>document.getElementById(id)?.addEventListener('change',()=>{if(id.startsWith('j'))render();else document.getElementById('charlist').innerHTML=renderCharList()}));document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{state.journeys.forEach(j=>j.pinned=false);state.journeys[+b.dataset.pin].pinned=true;save();render()});document.querySelectorAll('[data-jprog]').forEach(b=>b.onclick=()=>{let j=state.journeys[+b.dataset.jprog],v=prompt('Progress 0-100',j.progress);if(v!==null){j.progress=Math.max(0,Math.min(100,+v));save();render()}});document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>{state.journeys.forEach(j=>j.active=false);state.journeys[+b.dataset.active].active=true;save();render()});document.querySelectorAll('[data-gac]').forEach(b=>b.onclick=()=>{state.gac[b.dataset.gac]++;save();render()});document.querySelector('[data-resetgac]')?.addEventListener('click',()=>{if(confirm('Reset GAC counters?')){state.gac={attackWins:0,attackLosses:0,defenseWins:0,defenseLosses:0};save();render()}});document.querySelector('[data-note]')?.addEventListener('click',()=>{let v=document.getElementById('gacnote').value.trim();if(v){state.gac.notes=state.gac.notes||[];state.gac.notes.push({text:v,date:new Date().toLocaleString()});save();render()}});document.querySelector('[data-link]')?.addEventListener('click',()=>{let v=document.getElementById('ally').value.replace(/\D/g,'');if(v.length!==9){alert('Ally Code must be 9 digits.');return}state.allyCode=v;save();render()});document.querySelector('[data-sync]')?.addEventListener('click',syncApi);document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>editRes(+b.dataset.res));document.querySelector('[data-export]')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='swgoh-tracker-v06-backup.json';a.click()});document.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Reset all local tracker data?')){state=base();save();render()}})}
function editChar(i){let c=state.characters[i],n=prompt('Character name',c.name);if(n===null)return;c.name=n;c.gear=+(prompt('Gear level',c.gear)||c.gear);c.relic=+(prompt('Current relic',c.relic)||c.relic);c.target=+(prompt('Target relic',c.target)||c.target);save();render()}function editRes(i){let r=state.resources[i],n=prompt('Resource name',r.name);if(n===null)return;r.name=n;r.amount=+(prompt('Current amount',r.amount)||r.amount);r.target=+(prompt('Target amount',r.target)||r.target);save();render()}
async function syncApi(){let code=(state.allyCode||'').replace(/\D/g,'');if(code.length!==9){alert('Save a 9-digit Ally Code first.');return}let st=document.getElementById('status');if(st){st.className='status';st.textContent='Trying live SWGOH data source…'}let got=null;try{let r=await fetch('https://swgoh.gg/api/player/'+code,{headers:{Accept:'application/json'}});if(r.ok)got=await r.json()}catch(e){}if(!got)try{let r=await fetch('https://api.swgoh.help/swgoh/player',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({allycodes:[Number(code)],language:'ENG_US',project:{allyCode:1,name:1,gp:1,galacticPower:1,crystals:1,crystalCount:1,roster:1}})});if(r.ok)got=await r.json()}catch(e){}if(!got){if(st){st.className='status bad';st.textContent='Live sync failed from Safari. The cached roster was not replaced. This can be caused by CORS or API access restrictions.'}return}let p=got.result?got.result[0]:Array.isArray(got)?got[0]:got;let roster=p.roster||p.characters||[];state.profile=p;state.lastSync=new Date().toLocaleString();state.syncHistory=state.syncHistory||[];state.syncHistory.push({date:state.lastSync,gp:p.gp||p.galacticPower||0,rosterCount:roster.length});if(Array.isArray(roster)&&roster.length){state.characters=roster.map(x=>({name:x.name||x.characterName||'Unknown',gear:+(x.gear||x.gearLevel||0),relic:+(x.relic||x.relicTier||0),target:+(state.characters.find(c=>c.name===(x.name||x.characterName))?.target||5)}))}save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});save();render();})();</script></body></html>
